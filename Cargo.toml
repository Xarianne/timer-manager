[package]
name = "timer-manager"
version = "0.2.0"
edition = "2024"
description = "Create and manage systemd user timers from a small desktop app"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/Xarianne/timer-manager"

[dependencies]
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde_json = "1.0.154"
