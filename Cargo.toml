[package]
name = "timer-manager"
version = "0.4.1"
edition = "2024"
description = "Create and manage systemd user timers from a small desktop app"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/Xarianne/timer-manager"

[dependencies]
chrono = "0.4.45"
serde_json = "1.0.154"
# Versions match Fedora's rust-gtk4 and rust-libadwaita packages.
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
