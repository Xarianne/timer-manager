[package]
name = "timer-manager"
version = "0.3.2"
edition = "2024"
description = "Create and manage systemd user timers from a small desktop app"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/Xarianne/timer-manager"

[dependencies]
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
serde_json = "1.0.154"
# The GTK4/libadwaita prototype in src/bin/timer-manager-gtk.rs. Versions match Fedora's rust-gtk4 and rust-libadwaita.
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
